<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">OcheCore — simplified board</title>
  <desc id="description">A cream dartboard with bold burgundy rings and a solid green and red bullseye, centered between terminal brackets, with a fine steel-tip dart.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5edd9"/>
      <stop offset="1" stop-color="#e5d7b9"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c9895"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f5f0e3"/>
      <stop offset="1" stop-color="#8c9895"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="#c8b795" stroke-width="2"/>
  <g fill="none" stroke="#732d38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 95H33v66h12"/>
    <path d="M211 95h12v66h-12"/>
  </g>
  <!-- Open cream face with bold concentric rings, echoing the original blue icon. -->
  <g id="simplified-board" transform="translate(128 134)">
    <circle r="72" fill="#f0e3ce" stroke="#8f2837" stroke-width="8"/>
    <circle r="47" fill="none" stroke="#8f2837" stroke-width="7"/>
    <circle r="25" fill="#18543b"/>
    <circle r="11" fill="#8f2837"/>
  </g>
  <!-- Point at the bull; barrel, shaft, and flights extend toward the upper right. -->
  <g id="dart" transform="translate(128 134) rotate(-45)">
    <!-- Cream separation and dark edging keep the body readable over the rings. -->
    <path d="M25 0L33-5H66L73-2H88L101-22H130L120 0L130 20H101L88 2H73L66 5H33Z"
          fill="#f5edd9" stroke="#f5edd9" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 0L28-0.9V0.9Z" fill="#f4f6f3" stroke="#263b32" stroke-width="0.35"/>
    <path d="M71-2H96V2H71Z" fill="#f4f6f3" stroke="#17251f" stroke-width="1.3"/>
    <path d="M25 0L33-5H66L73-2V2L66 5H33Z" fill="url(#steel)" stroke="#17251f" stroke-width="1.3"/>
    <path d="M38-4.3v8.6m5-8.6v8.6m5-8.6v8.6m5-8.6v8.6m5-8.6v8.6m5-8.6v8.6" stroke="#42564b" stroke-width="1.1"/>
    <path d="M88 0L101-22H130L120 0Z" fill="#581b2a" stroke="#17251f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M88 0L101 20H130L120 0Z" fill="#943342" stroke="#17251f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M90 0H120" stroke="#f5edd9" stroke-width="2"/>
  </g>
</svg>
