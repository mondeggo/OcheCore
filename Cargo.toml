[workspace]
members = [
    "crates/oche-domain",
    "crates/oche-calibration",
    "crates/oche-capture",
    "crates/oche-vision",
    "crates/oche-replay",
    "crates/oche-engine",
    "crates/oche-api",
    "crates/oche-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
oche-domain = { path = "crates/oche-domain" }
oche-engine = { path = "crates/oche-engine" }
oche-api = { path = "crates/oche-api" }
oche-calibration = { path = "crates/oche-calibration" }
oche-capture = { path = "crates/oche-capture" }
oche-vision = { path = "crates/oche-vision" }
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
fs2 = "0.4"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
zune-jpeg = "0.5.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
