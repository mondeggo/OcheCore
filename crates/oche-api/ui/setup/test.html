<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="description" content="Test OcheCore scoring with a few practice throws.">
  <title>Test throws · OcheCore</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="test">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="OcheCore live view">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#17261f"/>
        <circle cx="24" cy="24" r="14" fill="#203b31" stroke="#8bdef4" stroke-width="2"/>
        <circle cx="24" cy="24" r="8" fill="none" stroke="#91dfb7" stroke-width="2"/>
        <circle cx="24" cy="24" r="2.6" fill="#ddf56f"/>
        <path d="M8 17v14M40 17v14" fill="none" stroke="#8bdef4" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Oche<span>Core</span></span>
    </a>
    <nav class="setup-nav" aria-label="Setup steps">
      <a class="setup-step" href="index.html" data-setup-step="1"><span class="step-number">01</span><strong>Board</strong></a>
      <a class="setup-step" href="cameras.html" data-setup-step="2"><span class="step-number">02</span><strong>Cameras</strong></a>
      <a class="setup-step" href="calibrate.html" data-setup-step="3"><span class="step-number">03</span><strong>Calibrate</strong></a>
      <a class="setup-step" href="test.html" data-setup-step="4"><span class="step-number">04</span><strong>Test</strong></a>
    </nav>
    <a class="btn btn-small btn-ghost setup-exit" href="../settings/index.html" data-exit-setup hidden>Exit setup</a>
    <a class="help-link" href="https://github.com/mondeggo/OcheCore" target="_blank" rel="noreferrer" aria-label="OcheCore on GitHub: documentation and source" title="OcheCore on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
  </header>

  <main class="page-shell" id="main-content">
    <div class="page-head">
      <h1>Throw some <span class="hero-highlight">darts.</span></h1>
      <p class="lede">Throw three darts. When it says Take out, pull them out.</p>
    </div>

    <div class="page-body play-body">
      <div class="detection-strip" aria-live="polite">
        <button class="btn btn-lime" type="button" data-command="start" data-when-stopped hidden>Start</button>
        <button class="btn" type="button" data-command="reset">Reset</button>
        <span class="board-state" id="board-state" data-tone="busy">Connecting</span>
        <div class="dart-slots" id="dart-slots"></div>
        <span class="visit-total">Total <strong id="visit-total">0</strong></span>
      </div>

      <div class="board-stage">
        <svg id="throw-board" viewBox="-235 -235 470 470" role="img" aria-label="Dartboard with the darts of the current visit"></svg>
        <div class="demo-throws" role="group" aria-label="Demo throws" data-demo-only hidden>
          <span>Demo</span>
          <button class="throw-btn" type="button" data-throw="T20">T20</button>
          <button class="throw-btn" type="button" data-throw="D20">D20</button>
          <button class="throw-btn" type="button" data-throw="SB">SB</button>
          <button class="throw-btn" type="button" data-throw="MISS">Miss</button>
          <button class="throw-btn" type="button" data-command="demo_takeout" data-args='{"remaining":0}'>Take out</button>
        </div>
      </div>
    </div>

    <nav class="footer-nav" aria-label="Page navigation">
      <a class="btn btn-ghost" href="calibrate.html">Back</a>
      <a class="btn btn-lime" href="../index.html" data-step-next>Finish <span aria-hidden="true">✓</span></a>
    </nav>
  </main>

  <footer class="status-bar" aria-label="Board status">
    <span class="status-state" id="status-state" data-tone="setup">Needs setup</span>
    <span class="status-item" id="status-cameras"></span>
    <span class="status-item" id="status-address"></span>
    <span class="status-item status-preview" id="status-connection">Connecting…</span>
  </footer>

  <script src="../assets/app.js" defer></script>
</body>
</html>
